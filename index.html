<body data-page="home">
  <main>
    <!-- 英雄区 -->
    <section id="top" class="hero">
      <div class="hero-inner">
        <p class="hero-kicker" data-t="hero_kicker"></p>
        <h1 class="hero-title" data-t-html="hero_title"></h1>
        <p class="hero-sub" data-t-html="hero_sub"></p>
        <div class="hero-cta">
          <a href="dogs.html" class="btn btn-primary" data-t="hero_cta1"></a>
          <a href="#base" class="btn btn-ghost" data-t="hero_cta2"></a>
        </div>
        <div class="hero-stats">
          <div><strong id="statTotal">0</strong><span data-t="stat_wait"></span></div>
          <div><strong>500+</strong><span data-t="stat_home"></span></div>
          <div><strong>2017</strong><span data-t="stat_year"></span></div>
        </div>
      </div>
      <div class="hero-art" aria-hidden="true">
        <img src="assets/art/homeward.webp" srcset="assets/art/homeward-small.webp 720w, assets/art/homeward.webp 1440w" sizes="(max-width: 760px) 100vw, 58vw" width="1440" height="960" alt="" class="homeward-art" fetchpriority="high" />
      </div>
    </section>

    <!-- 把参与入口放在基地长文前，让访客更快找到狗狗 -->
    <section class="section entries">
      <div class="section-head"><h2 data-t="home_entry_title"></h2></div>
      <div class="entry-grid">
        <a class="entry-card" href="dogs.html"><img class="entry-art" src="assets/art/dog.svg" alt="" width="64" height="64" aria-hidden="true" /><strong data-t="entry_dogs_t"></strong><span data-t="entry_dogs_d"></span><span class="entry-arrow" aria-hidden="true">↗</span></a>
        <a class="entry-card" href="stories.html"><img class="entry-art" src="assets/art/book.svg" alt="" width="64" height="64" aria-hidden="true" /><strong data-t="entry_stories_t"></strong><span data-t="entry_stories_d"></span><span class="entry-arrow" aria-hidden="true">↗</span></a>
        <a class="entry-card" href="foster.html"><img class="entry-art" src="assets/art/home.svg" alt="" width="64" height="64" aria-hidden="true" /><strong data-t="entry_foster_t"></strong><span data-t="entry_foster_d"></span><span class="entry-arrow" aria-hidden="true">↗</span></a>
        <a class="entry-card" href="adopt.html"><img class="entry-art" src="assets/art/path.svg" alt="" width="64" height="64" aria-hidden="true" /><strong data-t="entry_adopt_t"></strong><span data-t="entry_adopt_d"></span><span class="entry-arrow" aria-hidden="true">↗</span></a>
      </div>
    </section>

    <!-- 关于基地 -->
    <section id="base" class="base">
      <div class="base-inner">
        <div class="base-intro">
          <p class="base-kicker" data-t="base_kicker"></p>
          <h2 class="base-title" data-t="base_title"></h2>
          <img class="resting-art" src="assets/art/resting-dog.webp" width="720" height="480" alt="" aria-hidden="true" loading="lazy" />
        </div>
        <div class="base-text">
          <p data-t="base_p1"></p>
          <p data-t="base_p2"></p>
          <p data-t="base_p3"></p>
          <p class="base-highlight" data-t="base_p4"></p>
          <p data-t="base_p5"></p>
        </div>
      </div>
    </section>

  </main>
  <script src="data.js?v=28"></script>
  <script src="app.js?v=17"></script>
  <script src="ui-icons.js?v=1"></script>
